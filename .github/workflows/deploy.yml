name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:   # allows manual trigger

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [mock, real]   # run both modes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        env:
          USE_MEMORY_DB: true
          USE_MOCK: ${{ matrix.mode == 'mock' && 'true' || 'false' }}
          OPENAI_API_KEY: ${{ matrix.mode == 'real' && secrets.OPENAI_API_KEY || '' }}
        run: PYTHONPATH=$PYTHONPATH:$(pwd)/src pytest --maxfail=1 --disable-warnings -q

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/ai-knowledge-assistant:latest .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository }}/ai-knowledge-assistant:latest

  deploy-render:
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render Deploy
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys
