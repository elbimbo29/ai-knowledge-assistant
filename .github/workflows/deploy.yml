# ------------------------------------------------------------
# CI/CD Pipeline for ai-knowledge-assistant
# ------------------------------------------------------------
# Purpose:
#   - Automate testing, building, and deployment of the app.
#   - Runs on pushes, pull requests, and manual triggers.
# Jobs:
#   1. build-and-test: installs dependencies and runs pytest in both mock and real modes
#   2. docker-build-push: builds and pushes a Docker image to GitHub Container Registry (GHCR)
#   3. deploy-render: triggers a deployment on Render using its API
# ------------------------------------------------------------

name: CI/CD Pipeline

on:
  push:
    branches:
      - main          # Run pipeline when code is pushed to main branch
  pull_request:
    branches:
      - main          # Run pipeline on PRs targeting main
  workflow_dispatch:   # Allows manual trigger from GitHub UI

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [mock, real]   # Run tests in both mock and real modes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3   # Pulls the repo code into the runner

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'    # Use Python 3.12 for consistency

      - name: Cache pip
        uses: actions/cache@v3      # Speeds up builds by caching dependencies
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest        # Ensure pytest is available

      - name: Run pytest
        env:
          USE_MEMORY_DB: true       # Always use memory DB for tests
          USE_MOCK: ${{ matrix.mode == 'mock' }}   # True in mock mode, false in real mode
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # Inject secret key securely
        run: PYTHONPATH=$PYTHONPATH:$(pwd)/src pytest --maxfail=1 --disable-warnings -q
        # Purpose: Run tests with both mock and real modes to validate pipeline

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-and-test           # Only run if tests succeed
    if: github.ref == 'refs/heads/main'   # Only run on main branch
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # GitHub provides this token automatically

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository }}:latest .
        # Purpose: Build Docker image tagged with repo name

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository }}:latest
        # Purpose: Push image to GitHub Container Registry for deployment

  deploy-render:
    runs-on: ubuntu-latest
    needs: docker-build-push        # Only run if Docker image was pushed
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render Deploy
        run: |
          curl --fail -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys
        # Purpose: Call Render API to trigger deployment of latest Docker image
