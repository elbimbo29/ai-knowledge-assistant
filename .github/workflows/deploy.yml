name: CI/CD Pipeline   # Name of the workflow (shows in GitHub Actions tab)

on:
  push:
    branches:
      - main            # Trigger workflow when code is pushed to main branch
  pull_request:
    branches:
      - main            # Also trigger when a PR targets main branch

jobs:
  build-and-test:       # First job: run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3   # Pulls your repo code into the workflow runner

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'    # Use Python 3.10 environment

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest        # Install pytest for running tests

      - name: Run pytest
        run: pytest --maxfail=1 --disable-warnings -q
        # Runs your test suite (tests/test_rag.py).
        # Stops after 1 failure, suppresses warnings, quiet output.

  docker-build-push:    # Second job: build and push Docker image
    runs-on: ubuntu-latest
    needs: build-and-test          # Only runs if tests pass
    if: github.ref == 'refs/heads/main'   # Only runs on main branch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3   # Pull repo again for Docker build

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}       # GitHub username
          password: ${{ secrets.GITHUB_TOKEN }} # Auto-generated token for auth

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/ai-knowledge-assistant:latest .
          # Builds Docker image using your Dockerfile
          # Tags it with GHCR path: ghcr.io/<username>/<repo>:latest

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository }}/ai-knowledge-assistant:latest
          # Pushes the image to GitHub Container Registry

  deploy-render:        # Third job: trigger Render deployment
    runs-on: ubuntu-latest
    needs: docker-build-push       # Only runs if Docker build succeeds
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render Deploy
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys
          # Calls Render API to trigger a new deploy
          # Requires two GitHub secrets:
          #   RENDER_API_KEY   → your Render account API key
          #   RENDER_SERVICE_ID → ID of your Render service
